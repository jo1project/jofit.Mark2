name: Build & Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Jofit/**"
      - "project.yml"
      - ".github/workflows/testflight.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Install App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH=~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          BYTES=$(wc -c < "$KEY_PATH" | tr -d ' ')
          echo "Decoded .p8 key: $BYTES bytes"
          if [ "$BYTES" -lt 100 ]; then
            echo "::error::Decoded .p8 key is only $BYTES bytes — ASC_API_KEY_BASE64 is likely not a clean base64 encoding of the raw .p8 file (check for stray PEM header/footer lines or line breaks)."
            exit 1
          fi
          if ! head -1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::Decoded .p8 key does not start with '-----BEGIN PRIVATE KEY-----' — ASC_API_KEY_BASE64 secret looks malformed."
            exit 1
          fi

      - name: Archive
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project Jofit.xcodeproj \
            -scheme Jofit \
            -configuration Release \
            -archivePath build/Jofit.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Jofit.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/export/Jofit.ipa \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
