name: Build unsigned IPA (LiveContainer / sideload)

# Manual only: run from the Actions tab (or `gh workflow run unsigned-ipa.yml`), then download
# the artifact. Needs no Apple credentials — LiveContainer/sideloaders sign the app themselves.
# Push notifications and the home-screen widget won't work in that setup (they depend on this
# app's own entitlements), everything else does.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Jofit.xcodeproj \
            -scheme Jofit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Jofit.app Payload/
          rm -rf Payload/Jofit.app/PlugIns   # the widget can't run under LiveContainer
          zip -qry Jofit-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jofit-unsigned-ipa
          path: Jofit-unsigned.ipa
          retention-days: 3
